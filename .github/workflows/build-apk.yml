# 자동 APK 빌드: main에 코드가 올라오면(또는 Actions 탭에서 'Run workflow') 안드로이드 APK를 만든다.
# 서명 키는 저장소 Secret `ANDROID_KEYSTORE_B64`(gaia-test.jks 를 base64 로 바꾼 글자)에 넣어 둔다.
name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wellness-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 저장 분기 규칙 검사
        run: |
          javac -d /tmp/gaia-sync-test android/src/city/gaia/wellness/SyncDecision.java tools/SyncDecisionTest.java
          java -cp /tmp/gaia-sync-test SyncDecisionTest
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/gaia-json.jar
          javac -cp /tmp/gaia-json.jar -d /tmp/gaia-sync-test android/src/city/gaia/wellness/SaveBundle.java tools/SaveBundleTest.java
          java -cp /tmp/gaia-sync-test:/tmp/gaia-json.jar SaveBundleTest

      - name: Android SDK (platform 35, build-tools 35.0.0)
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: 빌드 이름·버전 정하기
        id: ver
        run: |
          LABEL=$(grep -o -m1 '빌드 10[0-9]*-[A-Z0-9.]*' index.html | head -1 | sed 's/빌드 //')
          [ -n "$LABEL" ] || LABEL="unknown"
          CODE=$((1100000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/android:versionCode=\"[0-9]+\"/android:versionCode=\"$CODE\"/; s/android:versionName=\"[^\"]*\"/android:versionName=\"$LABEL\"/" android/AndroidManifest.xml
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: 서명 키 준비
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p android/keys
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/keys/gaia-test.jks
            echo "signed=original" >> "$GITHUB_OUTPUT"
          else
            echo "::error::기존 서명 키 ANDROID_KEYSTORE_B64가 없습니다. 새 키로 바꾸지 않고 중단합니다."
            exit 1
          fi

      - name: 단일 HTML과 APK 만들기
        run: |
          python3 tools/build_standalone.py gaia-wellness.html
          python3 tools/build_apk.py gaia-wellness.html "GaiaWellness-${{ steps.ver.outputs.label }}-${{ steps.key.outputs.signed }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GaiaWellness-${{ steps.ver.outputs.label }}-${{ steps.key.outputs.signed }}
          path: |
            GaiaWellness-*.apk
            gaia-wellness.html
          retention-days: 30

      - name: 서버 업데이트 묶음 만들기
        run: python3 tools/prepare_web_update.py gaia-wellness.html web-update "${{ steps.ver.outputs.label }}"

      - name: 검증한 APK와 게임 업데이트 게시
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view wellness-live --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create wellness-live --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "가이아 웰니스 · 최신 설치 및 게임 업데이트" --notes "앱 실행 시 게임 업데이트를 확인합니다. 설치 APK는 빌드 이름을 확인하고 받아 주세요."
          gh release upload wellness-live web-update/game-*.html.gz "GaiaWellness-${{ steps.ver.outputs.label }}-${{ steps.key.outputs.signed }}.apk" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload wellness-live web-update/manifest.json --repo "$GITHUB_REPOSITORY" --clobber
