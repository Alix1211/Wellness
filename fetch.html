<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>물어와! · GAIA CITY</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,sans-serif;background:#234940;color:#fff4df;display:grid;place-items:center}button{font:inherit;cursor:pointer;border:0}#frame{width:100%;height:100dvh;max-width:1500px;display:flex;flex-direction:column;background:#fbf1dc;border:4px solid #e2bc80;border-radius:20px;overflow:hidden;box-shadow:0 12px 70px #0005;color:#365c53}header{display:flex;align-items:center;justify-content:space-between;height:48px;flex:none;padding:0 20px;border-bottom:2px solid #dfc69c;background:#fff8e7}h1{font-size:22px;margin:0}header span{font-size:11px;letter-spacing:2px;color:#789481}#game{min-height:0;flex:1;padding:8px;background:linear-gradient(#e1e9d7,#f5dfb4)}.ready{display:flex;align-items:center;justify-content:center;gap:35px;height:100%;background:linear-gradient(90deg,#fff5e9cc,#fff4da80),url('배경/센터/체육관.png') center/cover;border-radius:12px;padding:20px}.ready img{width:40%;height:90%;object-fit:contain;transform:scaleX(-1)}.ready section{max-width:370px}.ready h2{font-size:clamp(24px,4vw,48px);margin:0 0 12px}.ready p{line-height:1.8}.start{border:2px solid #fff1c8;background:linear-gradient(#e9a263,#c56d4d);color:#fff9df;box-shadow:0 5px #884a37;border-radius:17px;min-width:200px;padding:14px;font-size:24px;font-weight:800}.loading{display:grid;place-items:center;height:100%}@media(orientation:portrait){.ready{flex-direction:column;gap:0}.ready img{height:40%;width:80%}.ready section{text-align:center}.ready p{font-size:14px}header span{letter-spacing:0}}
</style></head><body><div id="frame"><header><h1>물어와!</h1><span>GAIA CITY · WELLNESS CENTER</span></header><main id="game"><div class="loading">준비 중…</div></main></div><script src="fetch-game.js"></script><script>
const FETCH_FILES=Object.fromEntries(['run1','run2','run3','run4','jump1','jump2','jump3','jump4','floor','floor-mirror'].map(n=>[n,'미니게임/fetch/'+n+'.webp']));
Object.assign(FETCH_FILES,{duck:'미니게임/behind/duck.webp',cat:'아이템/상품/cat.png',blind:'아이템/상품/blind.png',cuffs:'아이템/상품/cuffs.png',bg:'배경/센터/체육관.png'});
let game;const assets={};async function ready(){await Promise.all(Object.entries(FETCH_FILES).map(([n,src])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{assets[n]=im;resolve();};im.onerror=()=>reject(new Error(n));im.src=src;})));showReady();}function showReady(result){game?.destroy();const host=document.querySelector('#game');host.innerHTML='<div class="ready"><img alt="준비 자세"><section><h2></h2><p></p><button class="start"></button></section></div>';host.querySelector('img').src=assets.run1.src;host.querySelector('h2').textContent=result?'물어왔습니다!!':'멀리 던져도 갑니다!';host.querySelector('p').textContent=result?`${result.score}점 · ${result.time.toFixed(1)}초 · 충돌 ${result.collisions}회`:'전진을 빠르게 연타해서 달리고, 장애물 앞에서는 점프! 멀리 던진 고무오리를 회수해 주세요.';const start=host.querySelector('button');start.textContent=result?'한 번 더!':'시작!';start.onclick=()=>{host.replaceChildren();game=new FetchGame(host,{assets,bg:assets.bg,onFinish:showReady});};}ready().catch(()=>{document.querySelector('#game').textContent='그림을 불러오지 못했습니다. 다시 열어 주세요.';});
</script></body></html>
