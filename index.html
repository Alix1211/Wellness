<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>가이아 웰니스 센터</title>

<style>
:root{--ink:#304a4c;--ink-soft:#59776c;--leaf:#3e7969;--leaf-soft:#e1ede4;--cream:#fffcf3;--sand:#f4e7ce;--sand-dark:#d3bea0;--sky1:#a6dded;--sky2:#e5f5f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:#cef0f4;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
header{height:60px;padding:8px 22px;display:flex;align-items:center;justify-content:space-between;background:#fffcf3ec;position:relative;z-index:5;box-shadow:0 3px 15px #405f6415}
header small{font-size:11px;letter-spacing:3px;color:#719b92;display:block}
header h1{font-size:20px;margin:0}
nav{display:flex;gap:8px}
nav button{background:var(--leaf-soft);border-radius:12px;padding:9px 16px;color:#31594f}
nav button.active{background:var(--leaf);color:#fff}
#bar{height:40px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;background:#fffcf3cc;position:relative;z-index:4;font-size:14px}
#hud{display:flex;gap:14px;align-items:center;white-space:nowrap}
#hud b{font-weight:700}
#alerts{display:flex;gap:6px;overflow:auto;min-width:0}
.chip{background:#fff;border:1px solid #cfe0d4;border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.chip.hot{background:#ffe9ec;border-color:#f3b6c0}
.chip.blue{background:#e4f0ff;border-color:#a9c9f3}
.chip.pink{background:#ffe6f2;border-color:#f3b0d3}
.chip.gold{background:#fff3c8;border-color:#e6cb6c}
#view{height:calc(100dvh - 100px);overflow-y:auto;overflow-x:hidden;background:linear-gradient(var(--sky1),var(--sky2) 75%);position:relative}
#scene{display:flex;flex-direction:column;position:relative;transform-origin:top left}
#row{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:38px;padding:100px 40px 0;position:relative;z-index:1}
.sun{position:absolute;top:34px;right:9%;width:64px;height:64px;border-radius:50%;background:#fff6cc;box-shadow:0 0 60px #fff4c9}
.cloud{position:absolute;top:60px;left:10%;width:180px;height:28px;border-radius:50%;background:#ffffff95}
.ground{height:120px;flex:none;background:linear-gradient(#acd3a2 0 20px,#e9dfc8 20px 75px,#cbbda4 75px 80px,#e7d7bc 80px);border-top:5px solid #91bd8c;position:relative;z-index:0}
.building{position:relative;width:290px;flex:none;background:var(--sand);border:8px solid var(--sand);border-bottom:14px solid var(--sand-dark);box-shadow:8px 8px 0 #638b841c;border-radius:8px 8px 0 0}
.building.center{width:540px;background:#e5eee3;border-color:#e5eee3;border-bottom-color:#b8c9b9}
.roof{position:absolute;top:-51px;left:-15px;right:-15px;height:43px;border-radius:9px 9px 3px 3px;background:#4a7d72;color:#fff;text-align:center;padding:10px;font-weight:700;letter-spacing:3px;box-shadow:0 5px #c0d5c7;font-size:15px}
.building.home .roof{background:#ba826d;box-shadow:0 5px #e0cbb8}
.building.center .roof{background:#60978b}
.floor{display:flex;gap:8px;border-bottom:8px solid var(--sand);position:relative}
.center .floor{border-color:#e5eee3}
.floor:last-of-type{border-bottom:0}
.floor em{position:absolute;left:-30px;top:45%;font-size:11px;font-style:normal;color:#47726c}
.foundation{padding:12px;text-align:center;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{background:var(--leaf-soft);border-radius:12px;padding:9px 14px;color:#31594f;font-size:14px}
.pill[disabled]{opacity:.4;cursor:default}
.room{position:relative;flex:1 1 0;min-width:0;aspect-ratio:16/9;background:#dde2d5;overflow:hidden;outline-offset:-4px;border-radius:2px;user-select:none;-webkit-user-select:none}
.room>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.room:focus-visible{outline:4px solid #468c7b}
.room.empty{background:repeating-linear-gradient(135deg,#eef3ea 0 10px,#e3ebdf 10px 20px);display:grid;place-items:center;color:#7a978c;font-size:13px;border:2px dashed #b4cabb}
.room .label{position:absolute;bottom:5px;left:6px;background:#fff9eada;border-radius:5px;padding:2px 7px;font-size:11px;pointer-events:none;z-index:3}
.room .badge{position:absolute;top:5px;right:6px;background:#3e7969;color:#fff;border-radius:50%;width:20px;height:20px;display:none;place-items:center;font-size:11px;z-index:3}
body.editing .room .badge{display:grid}
body.editing .room:not(.empty){outline:3px dashed #3e7969aa;outline-offset:-3px}
.room.drop-ok{outline:4px solid #4aa37f;outline-offset:-4px}
.room.drop-no{outline:4px solid #d46a6a;outline-offset:-4px}
.stage-people{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:2%;padding:0 3% 3.5%;z-index:2;pointer-events:none}
.person{height:100%;display:flex;align-items:flex-end;justify-content:center;max-width:calc(94% / var(--n,1));pointer-events:auto;touch-action:none;cursor:grab;position:relative}
.person img.pose{height:100%;width:auto;max-width:100%;object-fit:contain;object-position:bottom;display:block;-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none;filter:drop-shadow(0 2px 2px #0003)}
.stage-people.free{display:block;padding:0}
.person.free{position:absolute;bottom:3.5%;height:96.5%;max-width:none}
.person.dragging{opacity:.3}
.person.pulse{animation:pulse .6s 4}
@keyframes pulse{50%{transform:scale(1.15)}}
.person .blush{position:absolute;left:50%;top:6%;width:56%;aspect-ratio:1.4;transform:translateX(-50%);background:radial-gradient(#ff6f9a 0,#ff6f9a00 68%);opacity:0;pointer-events:none;mix-blend-mode:multiply}
.person .face{position:absolute;left:50%;top:-12%;transform:translateX(-50%);height:26%;aspect-ratio:1;object-fit:contain;display:none;pointer-events:none;filter:drop-shadow(0 1px 2px #0005);background:#fffdf5e6;border-radius:50%;padding:1px}
.person.act .face{display:block}
.stage-big .person.prim .face{display:none}
.person .hp{position:absolute;left:14%;right:14%;bottom:-4px;height:5px;background:#0003;border-radius:3px;pointer-events:none}
.person .hp i{display:block;height:100%;border-radius:3px;background:#5cc27e;width:100%}
.person .dot{position:absolute;right:4%;top:14%;width:11px;height:11px;border-radius:50%;border:2px solid #fff;background:#5cc27e;pointer-events:none;box-shadow:0 1px 2px #0004}
.person .dot.warn{background:#f2c230}.person .dot.join{background:#4a90e2}.person .dot.marry{background:#f06aa8}.person .dot.grad{background:#e6b800}
.person .zz{position:absolute;left:2%;top:10%;font-size:18px;display:none;pointer-events:none;animation:zz 1s infinite alternate}
@keyframes zz{to{transform:translateY(-4px)}}
.person .heart{position:absolute;pointer-events:none;color:#ff5c93;font-size:16px;animation:rise 1.6s forwards;text-shadow:0 0 3px #fff}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-55px) scale(1.1)}}
#ghost{position:fixed;z-index:100;pointer-events:none;height:110px;transform:translate(-50%,-80%);filter:drop-shadow(0 6px 8px #0005)}
footer{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:6;background:#fffcf2ed;padding:7px;border-radius:18px;display:flex;gap:4px;box-shadow:0 5px 30px #304a4c25}
footer button{background:transparent;padding:9px 14px;color:#42685e;white-space:nowrap;border-radius:12px}
footer button.on{background:var(--leaf);color:#fff}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#304a4cee;color:#fff;border-radius:12px;padding:10px 18px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#card{position:fixed;z-index:50;width:250px;background:#fffdf5;border-radius:14px;padding:12px 14px;box-shadow:0 10px 40px #284f4655;font-size:13px;display:none}
#card h3{margin:0 0 2px;font-size:16px}
#card .tags{color:#7a978c;margin-bottom:6px}
.bar{display:grid;grid-template-columns:52px 1fr 28px;align-items:center;gap:6px;margin:3px 0}
.bar div{height:8px;background:#e3e9dc;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:#6bb59a}
.bar.hpb i{background:#5cc27e}
#card .meta{margin-top:6px;color:#59776c;line-height:1.5}
#card button{margin-top:8px}
dialog{border:0;border-radius:20px;padding:18px;background:#fffdf5;color:var(--ink);width:min(860px,94vw);max-height:92dvh;box-shadow:0 20px 80px #284f4666;overflow:auto}
dialog::backdrop{background:#203e4966}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dhead h2{margin:0;font-size:20px}
.dhead .close{font-size:26px;background:transparent;padding:4px 14px}
.stage-big{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#e4e9df}
.stage-big>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage-big[hidden]{display:none}
.stage-big.compact{width:min(400px,100%)}
.stage-big.shake{animation:shake .18s}
@keyframes shake{25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,2px)}}
.flash{position:absolute;inset:0;background:#fffbe0;opacity:0;pointer-events:none;z-index:6}
.flash.go{animation:fl .25s}
@keyframes fl{from{opacity:.85}to{opacity:0}}
.cap{position:absolute;left:2%;right:2%;top:3%;z-index:7;display:flex;gap:10px;align-items:center;background:#fffdf5ee;border-radius:14px;padding:8px 12px;min-height:60px}
.cap img{height:56px;width:56px;object-fit:contain;flex:none}
.cap b{display:block;font-size:12px;color:#719b92}
.cap span{font-size:16px}
.info{margin:12px 2px 0;font-size:14px;color:var(--ink-soft);line-height:1.6}
.dactions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:14px}
.choices button{background:#e7eee3;padding:8px;border-radius:10px;text-align:left;font-size:13px}
.choices img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;margin-bottom:5px;border-radius:6px}
.choices small{display:block;color:#6b867c;font-size:11px;margin-top:2px}
.choices button[disabled]{opacity:.4;cursor:default}
.choices h3{grid-column:1/-1;margin:6px 0 0;font-size:14px}
.ed select,.ed input,.ed textarea{background:#fff;border:1px solid #cfe0d4;border-radius:8px;padding:6px 8px}
.ed .tabs{display:flex;gap:6px;margin-bottom:10px}
.ed .tabs button{background:var(--leaf-soft);border-radius:10px;padding:8px 14px}
.ed .tabs button.on{background:var(--leaf);color:#fff}
.ed table{width:100%;border-collapse:collapse}
.ed td{padding:3px}
.ed td input.line{width:100%}
.ed td input.ms{width:70px}
.ed textarea{width:100%;min-height:90px}
.ed h4{margin:12px 0 4px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #e6eee2}
@media(max-width:650px){header{height:auto;flex-direction:column;align-items:flex-start;gap:6px}#view{height:calc(100dvh - 140px)}}
</style>
</head>

const G1=['하','서','지','민','수','예','유','채','다','소','나','윤','아','은','재','시','연','보','가','도'];
const G2=['은','연','윤','아','린','영','진','희','솔','빈','나','율','경','현','정','원','혜','인','라','우'];

const TAGP={ki:['요염','풋풋'],um:['대담','내숭'],bo:['순종적','고집'],ge:['활발','수줍음']};
const TAGX=['덜렁','꼼꼼','장난기','진지','엉뚱','먹보','잠꾸러기','씩씩'];

function newState(){
  return {v:3, cfg:{...CFG0}, t:0, day:0, gold:K.startGold, rep:K.startRep, grads:0, leaves:0, injuries:0,
    center:['lobby','basic','gear','group','recovery',null], extra:{},
    office:[{img:'개인사무실.png'}], home:[{img:'거실.png'}],
    members:[], next:1, ev:[], scripts:null, titles:[[],[],[],[]], granted:false};
}
function testGrant(S){ if(K.testGrant && !S.granted){ S.gold+=99999; S.rep=Math.max(S.rep,999); S.granted=true; } }
function startMembers(S){ for(let i=0;i<5;i++) addMember(S, true); }
const avg = m => (m.st.ki+m.st.um+m.st.bo+m.st.ge)/4;
const tierOf = m => { const a=avg(m); return a<35?0:a<55?1:a<80?2:3; };
const lobbyIndex = S => S.center.indexOf('lobby');
const inRoom = (S,b,i) => S.members.filter(m=>m.loc.b===b && m.loc.i===i);
function roomCap(S,i){ const R=ROOMS[S.center[i]]; return R ? Math.min(R.max, R.cap+(S.extra[i]||0)) : 0; }
const slotCap = b => 1;

function genName(S){
  for(let n=0;n<8;n++){ const nm=pick(SUR)+pick(G1)+pick(G2); if(!S.members.some(m=>m.name===nm)) return nm; }
  return pick(SUR)+pick(G1)+pick(G2);
}
function genTags(st){
  const ks=[...STATS].sort((a,b)=>st[b]-st[a]);
  const t=[pick(TAGP[ks[0]].slice(0,1)), TAGP[ks[3]][1]];
  if(rnd()<.25) t.push(pick(TAGX));
  return t;
}
function addMember(S, free){
  const L=lobbyIndex(S); if(L<0) return null;
  const base=14+rnd()*18, st={};
  STATS.forEach(k=>{ st[k]=Math.round(clamp(base+(rnd()-.5)*16,5,60)); });
  const m={id:S.next++, name:genName(S), nick:rnd()<.3?pick(NICK):'', tags:genTags(st), st, hp:100, sign:0, born:S.day, loc:{b:'center',i:L}, pose:0, tr:0, trained:false};
  m.sign=avg(m);
  S.members.push(m);
  if(!free){ S.gold+=K.visitFee; }
  return m;
}
const nameOf = m => m.nick || m.name;

function canPlace(S,m,b,i){
  const a=avg(m);
  if(b==='center'){
    const id=S.center[i], R=ROOMS[id];
    if(!R) return {ok:false,msg:'빈 칸입니다.'};
    if(!R.place) return {ok:false,msg:`${R.name}에는 회원을 넣을 수 없습니다.`};
    if(R.minAvg && a<R.minAvg) return {ok:false,msg:`${R.name}은(는) 평균 ${R.minAvg} 이상만 들어갑니다.`};
    const occ=inRoom(S,'center',i).filter(x=>x!==m).length, cap=roomCap(S,i);
    if(occ>=cap && !(cap===1 && m.loc.b==='center')) return {ok:false,msg:`${R.name}이(가) 가득 찼습니다.`};
    return {ok:true};
  }
  const need = b==='office' ? S.cfg.join : S.cfg.marry;
  if(!S[b][i]) return {ok:false,msg:'빈 칸입니다.'};
  if(a<need) return {ok:false,msg:`${b==='office'?'회사는':'집은'} 평균 ${need} 이상만 갈 수 있습니다.`};
  if(inRoom(S,b,i).some(x=>x!==m)) return {ok:false,msg:'이미 누가 있습니다.'};
  return {ok:true};
}
function place(S,m,b,i){
  if(b==='center'){
    const occ=inRoom(S,'center',i).filter(x=>x!==m);
    if(occ.length>=roomCap(S,i) && occ.length) occ[0].loc={...m.loc};     // 정원 1짜리가 차 있으면 자리 교환
    const RR=ROOMS[S.center[i]]; if(RR&&(RR.sets||RR.dev)) m.pose=Math.floor(rnd()*(RR.sets?RR.sets.length:GEAR.length));
  }
  m.loc={b,i}; m.tr=0;
}
function returnToLobby(S,m){ m.loc={b:'center',i:lobbyIndex(S)}; m.tr=0; }
function removeMember(S,m){ S.members=S.members.filter(x=>x!==m); }

function advance(S, dt){
  const out=[];
  for(const m of S.members){
    if(m.loc.b!=='center'){ m.hp=Math.min(100,m.hp+K.homeRegen*dt); continue; }
    const id=S.center[m.loc.i], R=ROOMS[id]; if(!R) continue;
    if(R.train){
      const eff=(m.hp<K.lowHp?K.lowEff:1)*(R.eff||1);
      let tot=0;
      for(const k in R.train){ const g=R.train[k]*dt*eff; m.st[k]=Math.min(100,m.st[k]+g); tot+=g; }
      m.hp-=R.hp*dt; S.rep+=tot*K.repPerPt; m.tr+=dt; if(m.tr>=0.3) m.trained=true;
      if(m.hp<=0) out.push(m);
    }else if(id==='recovery'){ m.hp=Math.min(100,m.hp+R.regen*dt); }
    else{ m.hp=Math.min(100,m.hp+(K.lobbyRegen+(S.center.includes('shop')?K.shopBonus:0))*dt); }
  }
  for(const m of out){
    S.gold=Math.max(0,S.gold-K.injuryFee); S.rep=Math.max(0,S.rep-1); S.injuries++; removeMember(S,m);
    S.ev.push(`${nameOf(m)}님이 무리한 훈련으로 부상을 입고 센터를 떠났습니다. 위약금 ${K.injuryFee}골드`);
  }
  for(const m of [...S.members]) if(STATS.every(k=>m.st[k]>=99.5)){
    S.gold+=K.thanks; S.rep+=K.thanksRep; S.grads++; removeMember(S,m);
    S.ev.push(`🎉 ${nameOf(m)}님이 모든 점수 100 달성! "안녕~" 사례비 ${K.thanks}골드`);
  }
  S.t+=dt;
  while(S.t>=S.day+1){ S.day++; endDay(S); }
}

function endDay(S){
  const C=S.cfg;
  for(const m of [...S.members]){
    if(m.loc.b==='center'){
      if(!m.trained) STATS.forEach(k=>{ m.st[k]=Math.max(0,m.st[k]-K.decay); });
      m.trained=false; m.tr=0;
      if(S.day-m.born>=K.grace && avg(m) < m.sign-K.leaveMargin){
        S.leaves++; S.rep=Math.max(0,S.rep-0.5); removeMember(S,m);
        S.ev.push(`${nameOf(m)}님이 점수가 떨어져 센터를 그만뒀습니다.`);
      }
    }else{
      STATS.forEach(k=>{ m.st[k]=clamp(m.st[k]+K.workDrift[0]+rnd()*(K.workDrift[1]-K.workDrift[0]),0,100); });
      S.rep+=avg(m)/100*K.workRepPerDay;
      const need=(m.loc.b==='office'?C.join:C.marry)-K.returnMargin;
      if(avg(m)<need){ returnToLobby(S,m); S.ev.push(`${nameOf(m)}님이 ${m.loc.b==='office'?'회사':'집'}에서 점수가 깎여 재입소했습니다.`); }
    }
  }
  if(S.day%C.monthDays===0){
    const n=S.members.filter(m=>m.loc.b==='center').length;
    if(n){ S.gold+=n*K.monthFee; S.ev.push(`월 회비 ${n*K.monthFee}골드 (${n}명)`); }
  }
  const lam=Math.min(K.visitMax, K.visitBase+S.rep*K.visitPerRep);
  let k=Math.floor(lam); if(rnd()<lam-k) k++;
  for(let i=0;i<k;i++){
    if(inRoom(S,'center',lobbyIndex(S)).length>=ROOMS.lobby.cap) break;
    const m=addMember(S,false); if(m) S.ev.push(`신규 회원 ${nameOf(m)}님이 도착했습니다. (+${K.visitFee}골드)`);
  }
}

/* 건설·확장 */
function buildRoom(S,i,id){
  const R=ROOMS[id]; if(!R) return {ok:false,msg:'없는 방입니다.'};
  if(S.rep<R.unlock) return {ok:false,msg:`명성치 ${R.unlock} 이상이 필요합니다.`};
  if(R.unique && S.center.includes(id)) return {ok:false,msg:'이미 있는 방입니다.'};
  if(S.gold<R.cost) return {ok:false,msg:`골드가 부족합니다. (${R.cost})`};
  S.gold-=R.cost; S.center[i]=id; delete S.extra[i]; return {ok:true};
}
function capCost(S,i){ const R=ROOMS[S.center[i]]; return R&&R.up ? R.up*((S.extra[i]||0)+1) : 0; }
function upgradeCap(S,i){
  const R=ROOMS[S.center[i]]; if(!R||!R.up||R.cap+(S.extra[i]||0)>=R.max) return {ok:false,msg:'더 늘릴 수 없습니다.'};
  const c=capCost(S,i); if(S.gold<c) return {ok:false,msg:`골드가 부족합니다. (${c})`};
  S.gold-=c; S.extra[i]=(S.extra[i]||0)+1; return {ok:true};
}
function addFloor(S){
  if(S.center.length>=12) return {ok:false,msg:'더 높이 지을 수 없습니다.'};
  if(S.gold<K.floorCost) return {ok:false,msg:`골드가 부족합니다. (${K.floorCost})`};
  S.gold-=K.floorCost; S.center.push(null,null); return {ok:true};
}
const sendable = (S,b) => S.members.filter(m=>m.loc.b==='center' && avg(m)>=(b==='office'?S.cfg.join:S.cfg.marry));
function expandInfo(S,b){
  const free=S[b].filter((_,i)=>!inRoom(S,b,i).length).length;
  const can=S[b].length<K.maxSlots && sendable(S,b).length>free;
  return {can, cost:K.slotCost*S[b].length, full:S[b].length>=K.maxSlots};
}
function expandSlot(S,b){
  const e=expandInfo(S,b);
  if(!e.can) return {ok:false,msg: e.full?'최대 칸 수입니다.':'보낼 수 있는 회원이 방보다 많아지면 늘릴 수 있습니다.'};
  if(S.gold<e.cost) return {ok:false,msg:`골드가 부족합니다. (${e.cost})`};
  S.gold-=e.cost; S[b].push({img: b==='office'?['공용사무실.png','파티션사무실.png'][S.office.length-1]||'공용사무실.png':['서재.png','빈방.png'][S.home.length-1]||'서재.png'}); return {ok:true};
}

function scriptKey(S,m){ const id=S.center[m.loc.i], R=ROOMS[id];
  if(R&&R.dev) return 'dev:'+GEAR[m.pose%GEAR.length].slice(0,2);

function getScript(S,key){ return (S.scripts&&S.scripts[key]) || DEF_SCRIPTS[key] || DEF_SCRIPTS.basic; }
function fillLine(S,m,line){
  const t=tierOf(m); let pool=[]; for(let k=t;k>=0&&!pool.length;k--) pool=S.titles[k]||[];
  return String(line).replace(/\{이름\}/g,nameOf(m)).replace(/\{호칭\}/g,()=> pool.length?pick(pool):'회원님');
}

function fitPose(img){

  const wrap=img.closest('.stage-people'); const n=wrap?(parseFloat(wrap.style.getPropertyValue('--n'))||1):1;

}

/* 소리 (WebAudio 합성) */
let AC=null;
function noise(len){ const b=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function sound(kind){
  if(!kind || !S.cfg.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime, out=AC.destination;
    const env=(g,a,d,v=1)=>{ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); };
    const nz=(f,type,q,a,d,v)=>{ const s=AC.createBufferSource(); s.buffer=noise(a+d+.05); const fl=AC.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q; const g=AC.createGain(); env(g,a,d,v); s.connect(fl).connect(g).connect(out); s.start(t); };
    const tone=(f0,f1,a,d,v,type='sine')=>{ const o=AC.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+a+d); const g=AC.createGain(); env(g,a,d,v); o.connect(g).connect(out); o.start(t); o.stop(t+a+d+.05); };
    if(kind==='thud'){ nz(260,'lowpass',1,.004,.12,.9); tone(110,48,.004,.16,.9); }
    else if(kind==='slap'){ nz(2200,'bandpass',.8,.002,.09,.8); nz(900,'lowpass',1,.002,.05,.5); }
    else if(kind==='ding'){ tone(880,880,.003,.5,.4); tone(1320,1320,.003,.35,.2); }
    else if(kind==='whoosh'){ nz(1200,'bandpass',1.5,.12,.2,.5); }
    else if(kind==='boing'){ tone(320,760,.01,.2,.5,'triangle'); }
  }catch{}
}
addEventListener('pointerdown',()=>{ try{ if(S.cfg.sound){ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); } }catch{} },{once:true});

function fit(){

}

let suppressClick=false;
function roomAt(x,y){ const el=document.elementFromPoint(x,y); const r=el&&el.closest?el.closest('.room'):null; return r&&r.dataset.slot!==undefined&&!r.closest('dialog')?r:null; }
function bindDrag(el,id){
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0) return;
    const m=mById(id); if(!m) return;
    const sx=e.clientX, sy=e.clientY; let started=false, hot=null; const ghost=$('#ghost');
    try{ el.setPointerCapture(e.pointerId); }catch{}
    const clear=()=>{ if(hot){ hot.classList.remove('drop-ok','drop-no'); hot=null; } };
    const onMove=ev=>{
      if(!started){ if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<8) return; started=true; dragging=true; el.classList.add('dragging'); ghost.src=$('img.pose',el).src; ghost.hidden=false; hideCard(); }
      ev.preventDefault(); ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px';
      const r=roomAt(ev.clientX,ev.clientY); if(r!==hot){ clear(); hot=r; }
      if(hot){ const ok=dropOk(m,hot); hot.classList.toggle('drop-ok',ok); hot.classList.toggle('drop-no',!ok); }
    };
    const finish=()=>{ el.removeEventListener('pointermove',onMove); el.removeEventListener('pointerup',onUp); el.removeEventListener('pointercancel',onCancel); try{ el.releasePointerCapture(e.pointerId); }catch{} };
    const onUp=ev=>{
      finish();
      if(!started){ suppressClick=true; setTimeout(()=>suppressClick=false,0); showCard(m,ev.clientX,ev.clientY); return; }
      ghost.hidden=true; clear(); dragging=false; suppressClick=true; setTimeout(()=>suppressClick=false,0);
      const r=roomAt(ev.clientX,ev.clientY);
      if(r){
        const b=r.dataset.kind, i=+r.dataset.slot;
        if(!(b===m.loc.b&&i===m.loc.i)){
          const c=canPlace(S,m,b,i);
          if(c.ok){ place(S,m,b,i); save(); } else toast(c.msg);
        }
      }
      pendingRender=false; render();
    };
    const onCancel=()=>{ finish(); ghost.hidden=true; clear(); dragging=false; el.classList.remove('dragging'); if(pendingRender){ pendingRender=false; render(); } };
    el.addEventListener('pointermove',onMove); el.addEventListener('pointerup',onUp); el.addEventListener('pointercancel',onCancel);
  });
}
function dropOk(m,r){ const b=r.dataset.kind,i=+r.dataset.slot; if(b===m.loc.b&&i===m.loc.i) return false; return canPlace(S,m,b,i).ok; }

/* 상세 카드 */
const card=$('#card');
function hideCard(){ card.style.display='none'; }
function showCard(m,x,y){
  const a=avg(m), tags=m.tags.join(' · ');
  const where = m.loc.b==='center' ? (ROOMS[S.center[m.loc.i]]||{}).name : TITLE[m.loc.b];
  const bar=(label,v,cls='')=>`<div class="bar ${cls}"><span>${label}</span><div><i style="width:${clamp(v,0,100)}%"></i></div><span>${Math.round(v)}</span></div>`;
  card.innerHTML=`<h3>${m.name}${m.nick?` <small>(${m.nick})</small>`:''}</h3><div class="tags">${tags}</div>`+
    STATS.map(k=>bar(SN[k],m.st[k])).join('')+bar('체력',m.hp,'hpb')+
    `<div class="meta">평균 <b>${a.toFixed(1)}</b> (가입 때 ${m.sign.toFixed(1)})<br>소속 ${S.day-m.born}일째 · ${where||''}<br>${statusText(m)}</div>`;
  if(m.loc.b!=='center'||m.loc.i!==lobbyIndex(S)){ const b=document.createElement('button'); b.className='pill'; b.textContent='로비로 보내기'; b.onclick=()=>{ returnToLobby(S,m); save(); hideCard(); render(); }; card.append(b); }
  const rb=document.createElement('button'); rb.className='pill'; rb.style.marginLeft='6px'; rb.textContent='방 보기'; rb.onclick=()=>{ hideCard(); openRoom(m.loc.b,m.loc.i); }; card.append(rb);
  card.style.display='block';
  const w=250,h=card.offsetHeight; card.style.left=clamp(x-w/2,8,innerWidth-w-8)+'px'; card.style.top=clamp(y+16,8,innerHeight-h-8)+'px';
}
function statusText(m){ const s=statusOf(m); return {grad:'🌟 졸업 임박!',marry:'💗 결혼 기준 도달',join:'🔷 입사 기준 도달',warn:'⚠ 가입 때보다 낮아요. 훈련이 필요합니다.',}[s]||'상태 양호'; }
document.addEventListener('pointerdown',e=>{ if(!card.contains(e.target)&&!e.target.closest('.person')) hideCard(); });

/* 방 대화창 */
const dlg=$('#dlg'); let cur=null;
function stopDlgActors(){ actors=actors.filter(a=>!a.dlg); }
function openRoom(k,i,refresh){
  cur={k,i}; hideCard();
  const id=k==='center'?S.center[i]:null;
  const stage=$('#dStage'); stage.replaceChildren(); stopDlgActors(); anim=anim.filter(a=>a.img.isConnected);
  const actions=$('#dActions'), choices=$('#dChoices'), info=$('#dInfo'); actions.replaceChildren(); choices.replaceChildren();
  const showChooser=(editing&&!refresh)||(k==='center'&&!id);
  if(k==='center'&&id){
    const t=ROOMS[id], cap=roomCap(S,i);
    $('#dTitle').textContent=`${t.name} · ${Math.floor(i/2)+1}층 ${i%2+1}번`;
    const bg=document.createElement('img'); bg.className='bg'; bg.src=bgUrl(FOLDER.center,t.bg); bg.alt=''; stage.append(bg);
    fillStage(stage,'center',i,true);
    const fl=document.createElement('div'); fl.className='flash'; stage.append(fl);
    const cp=document.createElement('div'); cp.className='cap'; cp.innerHTML='<img alt=""><div><b></b><span></span></div>'; stage.append(cp);
    const first=actors.filter(a=>a.el.closest('#dStage'));
    first.forEach((a,ix)=>{ a.dlg=true; a.primary=ix===0; if(ix===0) a.el.classList.add('prim'); });
    if(!first.length) cp.style.display='none';
    const gains = t.train ? Object.entries(t.train).map(([k2,v])=>`${SN[k2]} +${v}`).join(', ')+` /일 · 체력 −${t.hp}/일`+(t.eff<1?` · 1인당 효율 ${Math.round(t.eff*100)}%`:'') : (t.regen?`체력 +${t.regen}/일`:'');
    const n=inRoom(S,'center',i).length;
    info.textContent=t.desc+(t.place?`  (${n}/${cap}명)`:'')+(gains?`\n${gains}`:''); info.style.whiteSpace='pre-line';
    if(n>0&&id!=='lobby'){ const b=document.createElement('button'); b.className='pill'; b.textContent='방 비우기 (로비로)'; b.onclick=()=>{ inRoom(S,'center',i).forEach(m=>returnToLobby(S,m)); save(); render(); openRoom(k,i); }; actions.append(b); }
    const c=capCost(S,i);
    if(t.up){ const b=document.createElement('button'); b.className='pill'; const maxed=cap>=t.max; b.textContent=maxed?'정원 최대':`정원 +1 (${c}💰)`; b.disabled=maxed; b.onclick=()=>{ const r=upgradeCap(S,i); if(!r.ok) return toast(r.msg); save(); render(); openRoom(k,i); }; actions.append(b); }
  }else if(k==='center'){
    $('#dTitle').textContent=`센터 · ${Math.floor(i/2)+1}층 ${i%2+1}번 (빈 칸)`; info.textContent='만들 방을 고르세요.'; info.style.whiteSpace='';
  }else{
    const sl=S[k][i];
    $('#dTitle').textContent=`${TITLE[k]} · ${i+1}번 · ${stem(sl.img)}`;
    const bg=document.createElement('img'); bg.className='bg'; bg.src=bgUrl(FOLDER[k],sl.img); bg.alt=''; stage.append(bg);
    fillStage(stage,k,i,true);
    info.textContent=(k==='office'?`평균 ${S.cfg.join} 이상 회원이 갈 수 있습니다. 회사에서는 점수가 깎일 수 있고, 잘할수록 명성치가 오릅니다.`:`평균 ${S.cfg.marry} 이상(결혼) 회원이 갈 수 있습니다.`); info.style.whiteSpace='';
  }
  stage.hidden=(k==='center'&&!id); stage.classList.toggle('compact',showChooser);
  if(showChooser) buildChooser(k,i,choices);
  if(!dlg.open) dlg.showModal();
}
function buildChooser(k,i,box){
  const h=t=>Object.assign(document.createElement('h3'),{textContent:t});
  if(k==='center'){
    const curId=S.center[i];
    if(curId==='lobby'){ box.append(h('로비는 바꿀 수 없습니다.')); return; }
    box.append(h(curId?'다른 방으로 바꾸기 (비용 새로 지불)':'방 종류'));
    ROOM_ORDER.forEach(id=>{
      if(id==='lobby') return;
      const t=ROOMS[id], btn=document.createElement('button');
      const used=t.unique&&S.center.some((v,ix)=>v===id&&ix!==i), locked=S.rep<t.unlock;
      btn.disabled=used||id===curId||locked;
      const img=document.createElement('img'); img.src=bgUrl(FOLDER.center,t.bg); img.alt=''; btn.append(img,document.createTextNode(t.name));
      const sm=document.createElement('small'); sm.textContent= used?'이미 있음': locked?`🔒 명성 ${t.unlock}`:`${t.cost}💰 · ${t.cap?`${t.cap}명`:'배치 없음'}`; btn.append(sm);
      btn.onclick=()=>{
        const occ=inRoom(S,'center',i); const r=buildRoom(S,i,id); if(!r.ok) return toast(r.msg);
        occ.forEach(m=>returnToLobby(S,m)); save(); render(); openRoom('center',i);
      };
      box.append(btn);
    });
    if(curId){ const del=document.createElement('button'); del.textContent='철거'; del.style.background='#f3dede'; del.onclick=()=>{ inRoom(S,'center',i).forEach(m=>returnToLobby(S,m)); S.center[i]=null; save(); render(); dlg.close(); }; box.append(del); }
  }else{
    IMAGES[k].forEach(f=>{
      const btn=document.createElement('button'); const img=document.createElement('img'); img.src=bgUrl(FOLDER[k],f); img.alt='';
      btn.append(img,document.createTextNode(stem(f))); btn.disabled=S[k][i].img===f;
      btn.onclick=()=>{ S[k][i].img=f; save(); render(); openRoom(k,i); }; box.append(btn);
    });
  }
}
$('#dlg .close').onclick=()=>dlg.close();
dlg.addEventListener('close',()=>{ stopDlgActors(); });
const bd=(d)=>d.addEventListener('click',e=>{ if(e.target===d){ const r=d.getBoundingClientRect(); if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom) d.close(); } });
bd(dlg);

/* 설정 · 편집기 */
const dlg2=$('#dlg2'); bd(dlg2); $('#dlg2 .close').onclick=()=>dlg2.close();
function openSettings(){
  $('#d2Title').textContent='설정'; const b=$('#d2Body'); b.className=''; b.replaceChildren();
  const C=S.cfg;
  const row=(label,el)=>{ const r=document.createElement('div'); r.className='setrow'; r.append(Object.assign(document.createElement('span'),{textContent:label}),el); b.append(r); };
  const sel=(opts,val,fn)=>{ const s=document.createElement('select'); opts.forEach(([v,t])=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; if(String(v)===String(val)) o.selected=true; s.append(o); }); s.onchange=()=>{ fn(s.value); save(); updateHud(); }; return s; };
  const num=(val,fn,min,max)=>{ const n=document.createElement('input'); n.type='number'; n.value=val; n.min=min; n.max=max; n.style.width='80px'; n.onchange=()=>{ fn(clamp(+n.value||min,min,max)); save(); render(); }; return n; };
  row('하루 길이',sel([[1,'1분'],[2,'2분'],[3,'3분'],[5,'5분'],[10,'10분']],C.dayMin,v=>C.dayMin=+v));
  row('속도 (시험용)',sel([[1,'×1'],[2,'×2'],[5,'×5'],[10,'×10'],[30,'×30']],C.speed,v=>C.speed=+v));
  row('한 달 (일)',num(C.monthDays,v=>C.monthDays=v,3,30));
  row('입사(회사) 기준 평균',num(C.join,v=>C.join=v,10,95));
  row('결혼(집) 기준 평균',num(C.marry,v=>C.marry=v,20,99));
  row('효과음',sel([[1,'켜짐'],[0,'꺼짐']],C.sound?1:0,v=>C.sound=v==='1'));
  const gb=document.createElement('button'); gb.className='pill'; gb.textContent='골드 +99,999 · 명성 999'; gb.onclick=()=>{ S.gold+=99999; S.rep=Math.max(S.rep,999); save(); updateHud(); toast('지급했습니다.'); };
  row('시험용 지급',gb);
  const rs=document.createElement('button'); rs.className='pill'; rs.textContent='처음부터 다시 (저장 삭제)'; rs.style.background='#f3dede';
  rs.onclick=()=>{ if(rs.dataset.c!=='1'){ rs.dataset.c='1'; rs.textContent='정말 지울까요? 한 번 더 누르세요'; return; } S=newState(); startMembers(S); testGrant(S); save(); dlg2.close(); render(); };
  row('초기화',rs);
  dlg2.showModal();
}
function openEditor(){
  $('#d2Title').textContent='편집기'; const b=$('#d2Body'); b.className='ed'; b.replaceChildren();
  const tabs=document.createElement('div'); tabs.className='tabs'; const body=document.createElement('div'); b.append(tabs,body);
  const T=[['scene','장면 순서표'],['title','호칭'],['bk','백업']]; let tab='scene', key='basic';
  const keys=()=>[...ROOM_ORDER.filter(r=>ROOMS[r].place&&!ROOMS[r].dev),...DEV.map(n=>'dev:'+n.slice(0,2))];
  const kname=k=>k.startsWith('dev:')?`${GEARN.includes(k.slice(4))?'기구방':'특수훈련실'} · ${DEV.find(n=>n.startsWith(k.slice(4))).slice(2).replace('_',' ')}`:ROOMS[k].name;
  const draw=()=>{
    tabs.replaceChildren(); T.forEach(([id,t])=>{ const x=document.createElement('button'); x.textContent=t; x.className=tab===id?'on':''; x.onclick=()=>{ tab=id; draw(); }; tabs.append(x); });
    body.replaceChildren();
    if(tab==='scene'){
      const s=document.createElement('select'); keys().forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=kname(k); if(k===key) o.selected=true; s.append(o); }); s.onchange=()=>{ key=s.value; draw(); }; body.append(s);
      const cp=document.createElement('p'); cp.className='info'; cp.textContent='한 줄 = 표정 + 효과음 + 대사 + 시간(ms). 대사에 {이름} {호칭} 을 쓸 수 있습니다. 호칭은 점수 단계별로 호칭 탭에서 채웁니다.'; body.append(cp);
      if(!S.scripts) S.scripts={}; if(!S.scripts[key]) S.scripts[key]=JSON.parse(JSON.stringify(getScript(S,key)));
      const steps=S.scripts[key], tb=document.createElement('table');
      steps.forEach((st0,ix)=>{
        const tr=document.createElement('tr');
        const fs=document.createElement('select'); FACES.forEach(f=>{ const o=document.createElement('option'); o.value=f; o.textContent=f; if(f===st0.face) o.selected=true; fs.append(o); }); fs.onchange=()=>{ st0.face=fs.value; save(); };
        const ss=document.createElement('select'); SNDS.forEach(([v,t])=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; if(v===st0.snd) o.selected=true; ss.append(o); }); ss.onchange=()=>{ st0.snd=ss.value; sound(st0.snd); save(); };
        const ln=document.createElement('input'); ln.className='line'; ln.value=st0.line; ln.placeholder='대사'; ln.onchange=()=>{ st0.line=ln.value; save(); };
        const ms=document.createElement('input'); ms.className='ms'; ms.type='number'; ms.value=st0.ms; ms.step=100; ms.onchange=()=>{ st0.ms=clamp(+ms.value||1000,300,20000); save(); };
        const up=document.createElement('button'); up.textContent='↑'; up.onclick=()=>{ if(ix>0){ [steps[ix-1],steps[ix]]=[steps[ix],steps[ix-1]]; save(); draw(); } };
        const dx=document.createElement('button'); dx.textContent='✕'; dx.onclick=()=>{ steps.splice(ix,1); save(); draw(); };
        [fs,ss,ln,ms,up,dx].forEach(el=>{ const td=document.createElement('td'); td.append(el); tr.append(td); }); tb.append(tr);
      });
      body.append(tb);
      const act=document.createElement('div'); act.className='dactions';
      const add=document.createElement('button'); add.className='pill'; add.textContent='+ 줄 추가'; add.onclick=()=>{ steps.push({face:'기본',ms:1500,line:'',snd:''}); save(); draw(); };
      const rst=document.createElement('button'); rst.className='pill'; rst.textContent='이 장면 기본값으로'; rst.onclick=()=>{ delete S.scripts[key]; save(); draw(); };
      act.append(add,rst); body.append(act);
    }else if(tab==='title'){
      const p=document.createElement('p'); p.className='info'; p.textContent='회원의 점수 단계(평균 35 미만 / 55 미만 / 80 미만 / 그 이상)에 따라 대사의 {호칭} 자리에 들어갈 말을 한 줄에 하나씩 적습니다. 비워 두면 낮은 단계 것을, 전부 비면 "회원님"을 씁니다.'; body.append(p);
      ['1단계 (처음)','2단계','3단계','4단계 (최상)'].forEach((lab,t)=>{
        const h=document.createElement('h4'); h.textContent=lab; const ta=document.createElement('textarea'); ta.value=(S.titles[t]||[]).join('\n');
        ta.onchange=()=>{ S.titles[t]=ta.value.split('\n').map(x=>x.trim()).filter(Boolean); save(); }; body.append(h,ta);
      });
    }else{
      const p=document.createElement('p'); p.className='info'; p.textContent='내보내기를 누르면 아래 칸에 내용이 채워집니다. 복사해서 메모에 보관하세요. 불러오기는 아래 칸에 붙여 넣고 누르면 됩니다.'; body.append(p);
      const ta=document.createElement('textarea'); ta.style.minHeight='220px'; body.append(ta);
      const act=document.createElement('div'); act.className='dactions';
      const ex=document.createElement('button'); ex.className='pill'; ex.textContent='내보내기'; ex.onclick=()=>{ ta.value=JSON.stringify({scripts:S.scripts||{},titles:S.titles}); ta.select(); try{ navigator.clipboard.writeText(ta.value).then(()=>toast('복사했습니다.')).catch(()=>{}); }catch{} };
      const im=document.createElement('button'); im.className='pill'; im.textContent='불러오기'; im.onclick=()=>{ try{ const o=JSON.parse(ta.value); if(!o||typeof o!=='object') throw 0; if(o.scripts&&typeof o.scripts==='object') S.scripts=o.scripts; if(Array.isArray(o.titles)&&o.titles.length===4) S.titles=o.titles.map(a=>Array.isArray(a)?a.map(String):[]); save(); toast('불러왔습니다.'); }catch{ toast('형식이 올바르지 않습니다.'); } };
      act.append(ex,im); body.append(act);
    }
  };
  draw(); dlg2.showModal();
}

/* 버튼 */
$$('[data-focus]').forEach(b=>b.onclick=()=>{ focus=b.dataset.focus; applyFocus(); });
$('#btnEdit').onclick=()=>{ editing=!editing; document.body.classList.toggle('editing',editing); $('#btnEdit').classList.toggle('on',editing); $('#btnEdit').textContent=editing?'변경 완료':'방 변경'; if(editing) toast('바꿀 방을 누르세요.'); };
$('#btnSet').onclick=openSettings; $('#btnEditor').onclick=openEditor;
$('#btnFull').onclick=async()=>{ try{ if(document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }catch{ toast('전체 화면을 지원하지 않는 환경입니다.'); } };

preload(); render();
</script>
</body>
